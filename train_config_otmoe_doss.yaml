# train_config_otmoe.yaml
# XLSR-OTMoE训练配置（与ATADD对齐版本）

# 随机种子
seed: 42

# 数据参数
fs: 16000
cut: 64600           # 4.0375秒 * 16000Hz
win_len: 4.0375
num_workers: 8

# 训练参数
num_epochs: 80
batch_size: 64
# lr: 0.00001          # 降低10倍，与ATADD对齐
# weight_decay: 0.1    # 大幅增加正则化，与ATADD对齐
lr: 0.00001          #lr: 0.00003  
weight_decay: 0.05   # 0.01，避免过度正则化


# ========== ReduceLROnPlateau配置（与ATADD对齐）==========
scheduler_factor: 0.5           # lr衰减倍数
scheduler_patience: 3           # 容忍不改善的epoch数
scheduler_threshold: 0.0001 # 改善阈值
scheduler_min_lr: 1e-7          # 学习率下限

# 早停设置（与scheduler协同）
early_stopping: 8              # 保持8


# 标签平滑
label_smoothing: 0.0

# 梯度裁剪
grad_clip_norm: 0.5  # 更保守

# ========== 专家专精化损失超参数 (Advancing Expert Specialization) ==========
expert_beta: 0.00        # L_o 权重（专家正交）
routing_gamma: 0.00      # L_v 权重（路由方差）
balance_lambda: 0.00      # 原有路由平衡损失的权重（KL 散度）【新增】
reg_interval: 5          # 每 N 个 batch 计算一次（与 balance_loss 对齐）


# 门控记录
log_weights: true
gate_log_interval: 100

# 域原型样本数
n_prototype_samples: 5000

# 专家微调学习率比例
expert_lr_ratio: 0.2

# 优化器分组开关
use_layered_optimizer: true

# # 最佳模型标准：loss优先（与ATADD对齐）
# best_model_criterion: loss  # 'loss' 或 'acc'

moe_config:
  freezing_experts: true
  use_ot_gate: true
  log_weights: true
  num_weight_samples: 5
  weight_log_interval: 100

log_dir: '/data1/tjj/XLSR-MOE/OTMOE/logs'
# domain_cache_dir: '/data1/tjj/XLSR-MOE/FM/domainmix_cache_cluster24'
# shared_aasist_path: '/data1/tjj/XLSR-MOE/models_ssl_youhua/SSLAASIST_Mixed_best.pth'
domain_cache_dir: '/data1/tjj/XLSR-MOE/FM/domainmixxlsr_cache'
shared_aasist_path: '/data1/tjj/XLSR-MOE/models_ssl_youhua/SSLAASIST_Mixed_best.pth'

# SSL模型路径
ssl_path: '/data1/tjj/XLSR-MOE/xlsr2_300m.pt'
save_model_folder: '/data1/tjj/XLSR-MOE/OTMOE/ot_models_doss/deep/batch/domainmixxlsr_resdeep0.2_12xlsr256+otlossnoz'
# save_model_folder: '/data1/tjj/XLSR-MOE/OTMOE/ot_models_doss/deep/batch/domainmix_cache_cluster24_0.2+otlossnoz'
# save_model_folder: '/data1/tjj/XLSR-MOE/OTMOE/ot_models_doss/deep/batch/crossa0.2+otloss'

# ========== 预训练专家路径 ==========
expert_1_path: '/data1/tjj/XLSR-MOE/models_ssl/SSLAASIST_ASVspoof2019_best.pth'
expert_2_path: '/data1/tjj/XLSR-MOE/models_ssl/SSLAASIST_CFAD_best.pth'
expert_3_path: '/data1/tjj/XLSR-MOE/models_ssl/SSLAASIST_BCodecfake_best.pth'

# ========== 数据集路径 ==========
train_asv_root: "/data0/yyj/dataset/ASVspoof2019_LA/ASVspoof2019_LA/ASVspoof2019_LA_train/wav/"
train_asv_proto: '/data1/tjj/XLSR-MOE/DQ/dq/asv19_dq60.txt'
dev_asv_root: "/data0/yyj/dataset/ASVspoof2019_LA/ASVspoof2019_LA/ASVspoof2019_LA_dev/wav/"
dev_asv_proto: "/data0/yyj/dataset/ASVspoof2019_LA/ASVspoof2019_LA/ASVspoof2019_LA_cm_protocols/ASVspoof2019.LA.cm.dev.trl.txt"

train_cfad_root: '/data0/cff/CFAD/clean/train/'
train_cfad_proto: '/data1/tjj/XLSR-MOE/DQ/dq/cfad_dq60.txt'
dev_cfad_root: '/data0/cff/CFAD/clean/dev/'
dev_cfad_proto: '/data0/cff/CFAD/clean/dev.txt'

train_BCodec_root: '/data0/yyj/dataset/Codecfake/train/'
train_BCodec_proto: '/data1/tjj/XLSR-MOE/DQ/dq/codecfake_dq60.txt'
dev_BCodec_root: '/data0/yyj/dataset/Codecfake/dev/'
dev_BCodec_proto: '/data0/yyj/dataset/Codecfake/label/dev.txt'

